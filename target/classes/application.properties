spring.application.name=genai-java-fundamentals

# Neo4j (local instance)
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=Testing123

# Ollama (Llama 3.1 8B)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.1:8b
spring.ai.ollama.embedding.model=nomic-embed-text

# Neo4j vector store -> existing Review embeddings (review-text index, 768-dim)
spring.ai.vectorstore.neo4j.label=Review
spring.ai.vectorstore.neo4j.index-name=review-text
spring.ai.vectorstore.neo4j.embedding-property=embedding
spring.ai.vectorstore.neo4j.id-property=id
spring.ai.vectorstore.neo4j.text-property=text
# Index already exists in the database; do not let Spring recreate it.
spring.ai.vectorstore.neo4j.initialize-schema=false

# MCP client -> Neo4j MCP server (provides get_neo4j_schema / read_neo4j_cypher tools for /text2cypher)
spring.ai.mcp.client.stdio.enabled=true
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json
logging.level.org.springframework.ai.mcp=DEBUG
